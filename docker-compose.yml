# Docker Compose — полный стек: backend + frontend + PostgreSQL + Redis + tunnel
name: k0t1k

services:
  # === Локальная БД ===
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-k0t1k}
      POSTGRES_USER: ${POSTGRES_USER:-k0t1k}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-k0t1k_local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-k0t1k}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # === Локальный Redis ===
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # === Backend ===
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Локальные БД/Redis переопределяют .env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-k0t1k}:${POSTGRES_PASSWORD:-k0t1k_local}@postgres:5432/${POSTGRES_DB:-k0t1k}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend/data:/app/data
      - ./backend/models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # === Frontend (nginx) ===
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Пробрасываем из корневого .env в Vite build
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # === Cloudflare Tunnel ===
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --config /etc/cloudflared/config.yml run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    volumes:
      - ./cloudflared-config.yml:/etc/cloudflared/config.yml:ro
    depends_on:
      nginx:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
