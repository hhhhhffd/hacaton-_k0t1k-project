server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA — все маршруты → index.html
    # Cloudflare не должен кэшировать HTML — иначе деплой не обновится у пользователей
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header CDN-Cache-Control "no-store";
        add_header Cloudflare-CDN-Cache-Control "no-store";
    }

    # SSE стриминг endpoints — отключаем буферизацию
    location ~ /api/applications/\d+/explain-stream {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Проксирование API запросов к backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        client_max_body_size 100M;
    }

    # JS/CSS — кэшируем агрессивно (Vite добавляет хэш в имя файла, поэтому безопасно)
    # Cloudflare будет кэшировать их, но при новом деплое имена меняются → автообновление
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header CDN-Cache-Control "public, max-age=31536000";
    }

    # Картинки и шрифты — кэшируем надолго
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Отключаем логи для favicon
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
